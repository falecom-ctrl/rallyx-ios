name: iOS build (simulador)

# Compila o app num Mac da nuvem, sem assinatura e sem conta Apple — serve para
# provar que o projeto abre e compila. Nao gera .ipa instalavel em iPhone.
# Se um passo falhar, o final do log vai como "annotation" (visivel na tela do run
# e pela API sem precisar de permissao de admin).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias JS
        run: npm ci

      - name: Sync Capacitor (roda o pod install)
        run: |
          set +e
          npx cap sync ios 2>&1 | tee "$RUNNER_TEMP/sync.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 40 "$RUNNER_TEMP/sync.log" | tr -d '\r' | cut -c1-220 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cap sync falhou::$msg"
          fi
          exit $code

      - name: Versoes
        run: |
          xcodebuild -version
          pod --version

      - name: Compilar para o simulador (sem assinatura)
        working-directory: ios/App
        run: |
          set +e
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          code=$?
          tail -n 30 "$RUNNER_TEMP/xcodebuild.log"
          if [ "$code" -ne 0 ]; then
            msg=$( (grep -E "error:|fatal error:|ld: " "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -25; echo '--- fim do log ---'; tail -n 15 "$RUNNER_TEMP/xcodebuild.log") | tr -d '\r' | cut -c1-260 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=xcodebuild falhou::$msg"
          fi
          exit $code
